name: 构建 Debug APK

on:
  push:
    branches: ["build-debug-apk"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # runner 每次都会现生成 debug.keystore，导致各次构建签名不同、无法覆盖安装。
      # 这里把 keystore 缓存下来，一次生成长期复用，保证所有 debug 构建签名一致（覆盖安装不再冲突）。
      - name: 恢复固定的 Debug 签名
        id: debug-keystore
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.eta-signing/eta-debug.jks
          key: eta-debug-signing-v2

      - name: 生成 Debug 签名（仅首次）
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.eta-signing"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/.eta-signing/eta-debug.jks" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          test -s "$GITHUB_WORKSPACE/.eta-signing/eta-debug.jks"

      - name: 打印签名指纹（用于跨构建比对）
        run: |
          set -uo pipefail
          echo "cache-hit=${{ steps.debug-keystore.outputs.cache-hit }}"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          ls -l "$GITHUB_WORKSPACE/.eta-signing/eta-debug.jks"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/.eta-signing/eta-debug.jks" -storepass android \
            | grep 'SHA256:' | head -n 1 | sed 's/^ *//' \
            | tee "$RUNNER_TEMP/eta-debug-fingerprint.txt"

      - name: 接受 Android SDK 许可证
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --channel=3 "platforms;android-37.0"

      - name: 构建 Debug APK
        # 真机验证用；包含 Ubuntu 支持、DEB822 清理与文案修复。
        #
        # 显式把 keystore 喂给 Gradle：debug buildType 在 hasReleaseSigning 为真时
        # 会改用指定的 signingConfig（见 app/build.gradle.kts）。此前只把 keystore 放进
        # ~/.android 就指望 AGP 自己去找，实测 AGP 用的并不是那个文件——结果每次构建
        # 的 APK 证书都不同，覆盖安装随机失败。
        env:
          ETA_RELEASE_STORE_FILE: ${{ github.workspace }}/.eta-signing/eta-debug.jks
          ETA_RELEASE_STORE_PASSWORD: android
          ETA_RELEASE_KEY_ALIAS: androiddebugkey
          ETA_RELEASE_KEY_PASSWORD: android
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug

      # 打印 APK **自身**的证书指纹（不是 keystore 的），用于判断能否覆盖安装。
      # 之前只打印 keytool 读到的 keystore 指纹，真机装不上时无法定位到底是哪个环节变了。
      - name: 打印 APK 证书指纹
        run: |
          set -euo pipefail
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --print-certs app/build/outputs/apk/debug/*.apk

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 发布为 Release（便于手机直接下载安装）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          test -s "$apk"
          gh release delete ubuntu-preview --repo "${{ github.repository }}" --yes || true
          gh release create ubuntu-preview "$apk" \
            --repo "${{ github.repository }}" \
            --title "Ubuntu 环境支持预览版" \
            --target "${{ github.sha }}" \
            --notes "含 Ubuntu 25.04(plucky) 终端环境支持与 DEB822 源清理修复的 debug 构建，仅用于真机验证。"
