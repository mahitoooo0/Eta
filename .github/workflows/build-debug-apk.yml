name: 构建 Debug APK

on:
  push:
    branches: ["build-debug-apk"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 接受 Android SDK 许可证
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --channel=3 "platforms;android-37.0"

      - name: 构建 Debug APK
        # 真机验证用；包含 Ubuntu 支持与 DEB822 源清理修复
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 发布为 Release（便于手机直接下载安装）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          test -s "$apk"
          gh release create ubuntu-preview "$apk" \
            --repo "${{ github.repository }}" \
            --title "Ubuntu 环境支持预览版" \
            --target "${{ github.sha }}" \
            --clobber \
            --notes "含 Ubuntu 25.04(plucky) 终端环境支持与 DEB822 源清理修复的 debug 构建，仅用于真机验证。"
