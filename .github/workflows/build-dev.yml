name: 二改 Dev 构建（并行安装·无需 secrets）

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支/标签
        required: true
        default: main
      dev_suffix:
        description: 包名加 .dev 后缀（与官方版共存，勿覆盖安装时选 true）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eta-dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: 接受 SDK 许可证并装 platform 37
        run: |
          set -euo pipefail
          SDKM="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --channel=3 "platforms;android-37.0" >/dev/null

      - name: assembleDebug
        run: |
          set -euo pipefail
          props=()
          if [[ "${{ inputs.dev_suffix }}" == "true" ]]; then props+=(-PetaDevSuffix=1); fi
          ./gradlew --no-daemon --no-configuration-cache "${props[@]}" :app:assembleDebug

      - name: 收集产物
        id: apk
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          [[ -n "$apk" ]] || { echo "::error::找不到 APK"; find app/build -name '*.apk' | head; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"; sha256sum "$apk"
          unzip -l "$apk" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: eta-dev-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
